[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rngaudit"
version = "0.5.0"
description = "Fleet-level audit of randomness failures: finds weak RNG fingerprints in public keys, certificates and signatures."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# gmpy2 is effectively required for fleets above a few thousand RSA keys:
# measured batch-GCD time for 5,000 moduli is 2 s with it and ~6 minutes without.
dependencies = ["cryptography>=42", "gmpy2>=2.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4.18"]

[project.scripts]
rngaudit = "rngaudit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
